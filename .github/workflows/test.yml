name: Testar ITUFARNA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verificar segredos e bootstrap
        run: node scripts/test-no-secrets.mjs
      - name: Compilar Edge Functions quando existirem
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find supabase/functions -type f -name '*.ts' -print0 2>/dev/null || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'Nenhuma Edge Function ainda.'
          else
            deno check "${files[@]}"
          fi
